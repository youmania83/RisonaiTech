<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <rect width="480" height="120" fill="#ffffff"/>

  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#6C47FF"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5B0"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#6C47FF"/>
    </linearGradient>
  </defs>

  <!-- Icon mark (scaled to fit ~90px height, centered vertically) -->
  <g transform="translate(18, 15) scale(0.83)">
    <line x1="16" y1="16" x2="48" y2="16" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="16" x2="48" y2="48" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="48" x2="80" y2="48" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="48" x2="80" y2="16" stroke="url(#dotGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="16" y2="80" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="80" x2="48" y2="80" stroke="url(#dotGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="48" x2="48" y2="80" stroke="url(#dotGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="16" x2="112" y2="16" stroke="url(#dotGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="112" y1="16" x2="112" y2="80" stroke="url(#dotGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="80" x2="112" y2="80" stroke="url(#dotGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="80" x2="80" y2="80" stroke="url(#dotGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="5.5" fill="url(#iconGrad)"/>
    <circle cx="48" cy="16" r="4" fill="#6C47FF"/>
    <circle cx="80" cy="16" r="4" fill="#00C6FF"/>
    <circle cx="112" cy="16" r="5.5" fill="url(#dotGrad)"/>
    <circle cx="16" cy="80" r="4" fill="#6C47FF"/>
    <circle cx="48" cy="48" r="7" fill="url(#iconGrad)"/>
    <circle cx="80" cy="48" r="4" fill="#00E5B0"/>
    <circle cx="48" cy="80" r="4" fill="#00C6FF"/>
    <circle cx="80" cy="80" r="5.5" fill="url(#iconGrad)"/>
    <circle cx="112" cy="80" r="4" fill="#00E5B0"/>
    <circle cx="48" cy="48" r="12" fill="none" stroke="#6C47FF" stroke-width="1.5" opacity="0.3"/>
    <circle cx="48" cy="48" r="18" fill="none" stroke="#6C47FF" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- Wordmark -->
  <text x="118" y="62" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#0F0F1A">RISON</text>
  <text x="228" y="62" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#6C47FF">AI</text>
  <text x="260" y="62" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#0F0F1A">TECH</text>

  <!-- Gradient underline -->
  <rect x="118" y="68" width="196" height="2" rx="1" fill="url(#wordGrad)" opacity="0.85"/>

  <!-- Tagline -->
  <text x="119" y="86" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="400" letter-spacing="2.5" fill="#888780">AUTOMATE · INNOVATE · ACCELERATE</text>
</svg>
